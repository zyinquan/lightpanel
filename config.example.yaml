# LightPanel 示例配置
# 复制为 config.yaml 后按需修改；所有项都可用环境变量覆盖，例如：
#   LIGHTPANEL_SERVER__PORT=8080
#   LIGHTPANEL_DOCKER__SOCKET=/run/docker.sock
#   LIGHTPANEL_SECURITY__ENABLED=true

env: dev

server:
  host: 0.0.0.0
  port: 9000
  api_prefix: /api
  docs: true
  cors_origins:
    - "*"

security:
  # 面板可以控制容器，公网部署务必开启
  enabled: false
  api_token: ""
  token_file: ""
  header_name: X-LightPanel-Token

metrics:
  provider: psutil        # psutil | fake
  cache_ttl: 2.0          # 快照缓存秒数，避免前端高频轮询打爆 psutil
  history_size: 60        # 保留多少个采样点用于绘制趋势图
  disk_mounts: []         # 为空表示展示全部挂载点
  network_interfaces: []  # 为空表示统计全部网卡
  # 宿主机指标代理：面板跑在容器里时，本地 psutil 的 CPU/内存是所在内核的数字
  # （Linux 宿主机上即整机，Docker Desktop 上是它的 Linux 虚拟机），但网络只算本容器、
  # 磁盘只含挂进容器的目录。在宿主机上跑 `lightpanel-agent` 后填这里，概览页就能拿到
  # 完整一致的宿主机口径；连不上会自动回落到本地指标并提示。
  remote_url: ""          # 例如 http://host.docker.internal:9101/metrics
  remote_timeout: 2.0
  remote_token: ""        # 与 `lightpanel-agent --token` 一致，留空表示不鉴权

docker:
  enabled: true
  mode: auto              # auto | api | fake
  socket: /var/run/docker.sock
  host: ""                # 例如 tcp://127.0.0.1:2375，优先于 socket
  api_version: v1.44
  timeout: 10.0
  include_stopped: true

compose:
  enabled: true
  binary: docker
  subcommand: compose     # 使用 docker-compose 时改为 "" 并把 binary 设为 docker-compose
  search_paths:
    - /opt
    - /srv
    - /home
    - /data
  max_depth: 3
  timeout: 600.0
  # local: 在本进程执行 compose（要求面板与项目文件在同一文件系统）
  # agent: 交给宿主机上的 lightpanel-agent 执行。面板跑在容器里时**必须**用这个，
  #        否则 compose 文件里的 ./src:/app 会被解析成容器内路径，源码挂不上还不报错
  runner: local
  agent_url: ""           # 例如 http://host.docker.internal:9101
  agent_token: ""         # 与 `lightpanel-agent --token` 一致
  agent_timeout: 600.0

catalog:
  provider: yaml          # yaml | memory
  path: data/catalog.yaml
  # 首次启动若 path 不存在，从这个文件复制一份；容器部署指向 /app/data-examples/catalog.example.yaml
  example_file: ""

commands:
  extra_file: data/commands.yaml
  # 首次启动若 extra_file 不存在，从这个文件复制一份；容器部署指向 /app/data-examples/commands.yaml
  example_file: ""
  include_builtin: true
  allow_ad_hoc_argv: true
  allowed_binaries:
    - docker
    - docker-compose
  default_timeout: 120.0
  max_timeout: 1800.0

logging:
  level: INFO
  format: plain      # plain | json
