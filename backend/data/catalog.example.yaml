# 软件目录示例（首次启动时会被复制为 catalog.yaml）
# 字段说明：
#   id     唯一标识，省略时由 name 生成
#   tags   软件标签，用于分组与筛选
#   icon   单个 emoji 或图标名称
entries:
  - id: lightpanel
    name: LightPanel
    url: http://localhost:9000
    description: 本面板自身
    icon: 🛰️
    color: "#4f8cff"
    category: 运维
    tags: [面板, 自托管, 运维]
    enabled: true
    order: 0

  - id: portainer
    name: Portainer
    url: http://localhost:9443
    description: Docker 图形化管理
    icon: 🐳
    color: "#13b8d4"
    category: 运维
    tags: [Docker, 容器, 运维]
    enabled: true
    order: 1

  - id: grafana
    name: Grafana
    url: http://localhost:3000
    description: 指标可视化
    icon: 📈
    color: "#f46800"
